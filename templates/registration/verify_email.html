{% extends "base.html" %}

{% block title %}Confirm Email Address{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-5">
        <div class="card dashboard-card p-5 text-center">
            <h2 class="fw-bold">Verify your email</h2>

            <p class="text-muted">
                Confirm that you own the email address used
                to register with RentFlow.
            </p>

            <form method="POST">
                {% csrf_token %}

                <button class="btn btn-primary w-100">
                    Verify email address
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
