{% extends "base.html" %}

{% block title %}Existing RentFlow Account{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7">
        <div class="card dashboard-card p-5 text-center">
            <h2 class="fw-bold">An account already exists</h2>

            <p class="text-muted">
                A RentFlow account already uses {{ email }}.
                Sign in to that account or contact your landlord
                for help linking it to your tenant profile.
            </p>

            <a href="{% url 'login' %}"
               class="btn btn-primary">
                Sign in
            </a>
        </div>
    </div>
</div>
{% endblock %}
