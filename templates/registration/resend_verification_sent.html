{% extends "base.html" %}

{% block title %}Verification Request{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7">
        <div class="card dashboard-card p-5 text-center">
            <h2 class="fw-bold">Check your inbox</h2>

            <p class="text-muted">
                If an eligible unverified account exists for that
                email address, a new verification link has been sent.
            </p>

            <a href="{% url 'login' %}"
               class="btn btn-primary">
                Return to sign in
            </a>
        </div>
    </div>
</div>
{% endblock %}
