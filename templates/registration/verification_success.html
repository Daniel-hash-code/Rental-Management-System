{% extends "base.html" %}

{% block title %}Email Verified{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-6">
        <div class="card dashboard-card p-5 text-center">
            <h2 class="fw-bold text-success">
                Email successfully verified!
            </h2>

            <p class="text-muted">
                Your RentFlow landlord account is now active.
                You can sign in and start managing your properties.
            </p>

            <a href="{% url 'login' %}"
               class="btn btn-primary">
                Sign in to RentFlow
            </a>
        </div>
    </div>
</div>
{% endblock %}
